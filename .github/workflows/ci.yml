name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1   # production services run Node 22
      # types.test.js compares types/contracts.d.ts with the pinned Contracts release
      - run: git clone --depth 1 --branch v0.6.0 https://github.com/OpenVibers/OpenVibe.Contracts.git ../OpenVibe.Contracts
      - run: npm test             # includes the pack test (npm pack + install into a temp project)
      - run: node scripts/esm.js --check
