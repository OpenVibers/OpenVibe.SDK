name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1   # production services run Node 22
          cache: npm
      # devDependencies: better-sqlite3 backs the outbox/inbox tests; openvibe-contracts (pinned tag
      # tarball) validates the tools tests' requests and answers, and types.test.js compares
      # types/contracts.d.ts with it.
      - run: npm ci --no-audit --no-fund
      - run: npm test             # includes the pack test (npm pack + install into a temp project)
      - run: node scripts/esm.js --check
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo (Track Q).
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@83c998b65424fb97e6f6de55ad9cc5981767e89c
